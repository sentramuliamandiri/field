/* ===== v41 mobile-first layer (HP Android & iOS) ===== */
#bnav,#fab,#moreSheet{display:none}

 input,select,textarea{font-size:16px!important;min-height:42px}

 /* bottom navigation */
 #bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(20,36,74,.08)}
 #bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;min-height:54px;color:var(--muted);font-size:11px;font-weight:600;position:relative;border-radius:12px}

 #bnav button.on{color:var(--ink)}#bnav button.on .bi{background:#dcebe2}

 #fab{display:flex;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:44;align-items:center;gap:6px;height:52px;padding:0 20px 0 16px;border-radius:16px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(46,125,79,.35)}

 #moreSheet.open{display:block;position:fixed;inset:0;z-index:70}

 #moreSheet .ms{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:sheetUp .2s ease-out}

 /* modals & drawers become bottom sheets */
 .modal{padding:0!important;align-items:flex-end!important;overflow:hidden!important}

 table.tt>tbody>tr>td[data-l="Qty"],table.tt>tbody>tr>td[data-l="RFQ / Pelanggan"]{order:3;flex:0 1 auto!important;font-size:13px}

 table.tt>tbody>tr>td[data-l="RFQ / Pelanggan"]{flex:1 1 150px!important}

 .rfql .gh{padding:12px 14px!important}
 .rfql .ga{gap:8px!important;flex-wrap:wrap!important}.rfql .ga button.sm{flex:1 1 auto}
 .rfql .tbl-wrap.flat{background:var(--sunk)!important;border-radius:0 0 16px 16px!important;padding:10px!important}

 .gl{padding:14px!important}.gl-ck span{width:30px;height:30px}
 .oseg{display:grid!important;grid-template-columns:repeat(3,1fr);border-radius:12px!important;overflow:hidden}

 #viewQuotes .seg{display:flex;flex-wrap:wrap;gap:6px;border:0;overflow:visible}#viewQuotes .seg button{border:1px solid var(--line)!important;border-radius:999px!important}
 .pe-gr,.pe-it{padding:12px!important}
 .chips .chip .gp{font-size:12.5px;padding:7px 12px}
 .rpw{min-height:44px;border-radius:12px}.rpw input{min-height:42px}

}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}


/* v43 ask: quick copy */

.rfql{background:transparent!important;border:0!important;box-shadow:none!important;overflow:visible!important}

<title>Tracking Pengadaan SMM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: workshop ledger — status rail on top, filter bar, dense item register, side drawer for detail */
:root{
  --bg:#eef4ef; --surface:#ffffff; --sunk:#f1f5f3; --line:#d6e0da; --fg:#14244a; --muted:#5a6a82;
  --accent:#2e7d4f; --accent-fg:#ffffff; --ink:#1b3264;
  --danger:#c0392b; --ok:#2e7d4f;
  --s-baru:#7a879b; --s-cari:#2f6db5; --s-tawar:#6b4fb0; --s-po:#c27a1a; --s-beli:#13808a; --s-kirim:#3c74c0; --s-tiba:#2e7d4f; --s-batal:#b0413a; --s-kalah:#8a5a44;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}


*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:20px;border-bottom:2px solid var(--fg);padding-bottom:12px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.ink{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
textarea{width:100%;font-family:var(--f-mono);font-size:12.5px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
label.f input,label.f select,label.f textarea{color:var(--fg);font-size:14px;font-weight:400}
.banner{padding:10px 12px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:13px}
/* status rail */
.rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rail button{border:0;border-radius:0;background:var(--surface);text-align:left;padding:10px 12px;display:flex;flex-direction:column;gap:2px;position:relative}
.rail button::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--c)}
.rail button .n{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.rail button .l{font-size:12px;color:var(--muted)}
.rail button.on{background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.rail button.late .n{color:var(--danger)}
/* tabs + filters */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tabs button{border:0;border-radius:0;background:var(--surface)}
.tabs button.on{background:var(--fg);color:var(--bg)}
.bar .grow{flex:1 1 220px}
.chipline{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;background:var(--surface);color:var(--fg)}
.chip button{padding:0 6px;border:0;background:transparent;color:var(--muted)}
/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
tbody tr.sel td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pn{font-family:var(--f-mono);font-size:13px;font-weight:500;white-space:nowrap}
.sub{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
select.stsel{max-width:150px;font-size:12px;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 45%,var(--line));padding:3px 6px}
.late-tag{color:var(--danger);font-weight:600;font-size:12px}
.src{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);margin-right:4px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--f-display);font-size:22px;color:var(--fg);margin:0 0 6px}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 12px;border:1px solid var(--accent);border-radius:8px;background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
/* rfq list */
.rfqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rfq{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rfq .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rfq .no{font-family:var(--f-mono);font-weight:500}
.rfq .cust{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.1}
.prog{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.prog span{background:var(--c)}
.rfq .ft{display:flex;gap:6px;flex-wrap:wrap}
/* overlay: drawer + modal */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.modal{position:fixed;inset:0;z-index:41;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;overflow-y:auto}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(980px,100%);display:flex;flex-direction:column}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh h2{font-family:var(--f-display);font-size:22px;font-weight:600;margin:0}
.db{padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex:1}
.df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

<script>
const STATUSES=[
 {k:"baru",l:"Belum Diproses",c:"--s-baru"},
 {k:"cari",l:"Cek Harga Supplier",c:"--s-cari"},
 {k:"tawar",l:"Sudah Ditawarkan",c:"--s-tawar"},
 {k:"po",l:"PO Diterima – Perlu Dibeli",c:"--s-po"},
 {k:"beli",l:"Sudah Dibeli",c:"--s-beli"},
 {k:"kirim",l:"Dalam Pengiriman",c:"--s-kirim"},
 {k:"tiba",l:"Sudah Tiba",c:"--s-tiba"},
 {k:"kalah",l:"Tidak Diorder",c:"--s-kalah"},
 {k:"batal",l:"Tidak Jadi",c:"--s-batal"},
];
const ST=Object.fromEntries(STATUSES.map(s=>[s.k,s]));
const PLATFORMS=["Tokopedia","Shopee","Lazada","Blibli","Bukalapak","TikTok Shop","Lainnya"];
const UNITS=new Set(["PCS","PC","EA","UNIT","UNITS","SET","SETS","BTL","LTR","LITER","KG","MTR","METER","ROLL","BOX","PAIR","PRS","LOT","PAIL","DRUM","PACK","PK","LBR","LEMBAR","BH","BUAH","KIT","ASSY","GLN","GALON","CAN","TUBE","SHEET","PSG","PASANG","EACH","NOS","PAK","DUS","KALENG"]);

const S={roles:{},sellBy:{},apprBy:{},sell:{},members:{},isOwner:false,quotes:{},approvals:{},names:{},isApprover:false,qFilter:"",suppliers:{},settings:null,markup:(()=>{try{const v=localStorage.getItem("smm_markup");return v===null?20:Number(v)}catch{return 20}})(),hideDone:true,open:new Set(),shown:40,pageSize:40,pnCount:{},rfqs:{},items:[],tab:"rfq",status:"",late:false,rfqId:"",q:"",cust:"",sup:"",sel:new Set(),canWrite:true,db:null,user:null,myId:null,names:{}};
const canW=()=>S.canWrite!==false;
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtD=s=>{if(!s)return"";const p=String(s).slice(0,10).split("-");if(p.length<3)return String(s);return `${p[2].padStart(2,"0")}/${p[1].padStart(2,"0")}/${p[0]}`};
const fmtDT=t=>{if(!t)return"";const d=new Date(t);const z=n=>String(n).padStart(2,"0");return `${z(d.getDate())}/${z(d.getMonth()+1)}/${d.getFullYear()} ${z(d.getHours())}.${z(d.getMinutes())}`};
const rp=n=>(n===""||n==null||isNaN(n))?"":"Rp "+Number(n).toLocaleString("id-ID");
const normPn=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const isLate=it=>it.eta&&it.eta<today()&&["beli","kirim","po"].includes(it.status);
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
function srcLabel(it){if(it.source==="ecom")return (it.platform||"E-commerce")+(it.supplier?" · "+it.supplier:"");return it.supplier||""}

/* ---------- parsing ---------- */
const PN_RE=/^(?=.*\d)[A-Z0-9][A-Z0-9\-\/.]{3,}$/i;
const NUM_RE=/^\d+(?:[.,]\d+)?$/;
function isPn(t){if(!PN_RE.test(t))return false;if(/^\d+$/.test(t))return t.length>=5;if(/^\d+[.,]\d+$/.test(t))return false;return true}
function qtyVal(t){return Number(String(t).replace(",","."))}
function guessCells(cells){
  cells=cells.map(c=>c.trim()).filter(c=>c!=="");
  if(cells.length>1&&/^\d{1,3}[.)]?$/.test(cells[0]))cells.shift();
  let qty="",unit="",part="",used=new Set();
  for(let i=cells.length-1;i>=0;i--){const u=cells[i].toUpperCase().replace(/[.,]/g,"");
    if(UNITS.has(u)&&i>0&&NUM_RE.test(cells[i-1])){unit=u;used.add(i);qty=qtyVal(cells[i-1]);used.add(i-1);break}}
  if(qty===""){for(let i=cells.length-1;i>=0;i--){if(!used.has(i)&&NUM_RE.test(cells[i])&&!(cells[i].length>=5&&/^\d+$/.test(cells[i]))){qty=qtyVal(cells[i]);used.add(i);break}}}
  let best=-1;for(let i=0;i<cells.length;i++){if(used.has(i))continue;if(isPn(cells[i])){if(best<0||(/-/.test(cells[i])&&!/-/.test(cells[best])))best=i}}
  if(best>=0){part=cells[best];used.add(best)}
  const desc=cells.filter((_,i)=>!used.has(i)).join(" ").replace(/\s+/g," ").trim();
  return {part,desc,qty,unit};
}
const HEAD={part:/part|p\/n|^pn$|kode|code|no\.?\s*part|item\s*no|material/i,desc:/desc|deskripsi|nama|name|uraian|keterangan|spesifikasi|^item$/i,qty:/^q'?ty|quantity|jumlah|^jml/i,unit:/^unit$|uom|satuan|^sat$/i,brand:/merk|merek|brand/i};
function findHeader(rows){for(let r=0;r<Math.min(rows.length,8);r++){const m={};rows[r].forEach((c,i)=>{for(const k in HEAD){if(m[k]==null&&HEAD[k].test(c.trim()))m[k]=i}});if((m.part!=null||m.desc!=null)&&m.qty!=null)return{r,m}}return null}
function isJunk(line){return /^(total|sub\s*total|grand|catatan|note|terbilang|hormat|page|halaman)\b/i.test(line.trim())}
function parsePaste(text){
  const lines=text.split(/\r?\n/).map(l=>l.replace(/ /g," ").replace(/\s+$/,"")).filter(l=>l.trim());
  if(!lines.length)return[];
  let rows;
  if(lines.filter(l=>l.includes("\t")).length>=lines.length*.5)rows=lines.map(l=>l.split("\t"));
  else if(lines.filter(l=>/\S {2,}\S/.test(l.trim())).length>=lines.length*.5)rows=lines.map(l=>l.trim().split(/ {2,}/));
  else rows=lines.map(l=>l.trim().split(/\s+/));
  const h=findHeader(rows);const out=[];
  const start=h?h.r+1:0;
  for(let r=start;r<rows.length;r++){
    const cells=rows[r];const joined=cells.join(" ");
    if(isJunk(joined))continue;
    let it;
    if(h){const g=k=>h.m[k]!=null?(cells[h.m[k]]||"").trim():"";
      it={part:g("part"),desc:[g("desc"),g("brand")].filter(Boolean).join(" · "),qty:g("qty")?qtyVal(g("qty")):"",unit:g("unit").toUpperCase()};
      if(isNaN(it.qty))it.qty="";
    } else {
      if(!h&&r<3&&Object.values(HEAD).filter(re=>cells.some(c=>re.test(c))).length>=2)continue;
      it=guessCells(cells);
    }
    if(it.qty===""&&(!it.part||(!h&&out.length))){const extra=joined.replace(/\s+/g," ").trim();if(out.length&&extra){out[out.length-1].desc=(out[out.length-1].desc+" "+extra).trim()}continue}
    if(!it.qty)it.qty=1;
    out.push(it);
  }
  return out;
}
async function pdfToText(file){
  if(!window.pdfjsLib)throw new Error("Pembaca PDF belum termuat. Coba lagi sebentar.");
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf,disableWorker:true}).promise;
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);const tc=await page.getTextContent();
    const rows=[];
    for(const it of tc.items){if(!it.str||!it.str.trim())continue;const y=it.transform[5],x=it.transform[4];
      let row=rows.find(r=>Math.abs(r.y-y)<3);if(!row){row={y,parts:[]};rows.push(row)}row.parts.push({x,w:it.width||0,s:it.str})}
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows){r.parts.sort((a,b)=>a.x-b.x);let line="",end=null;
      for(const pt of r.parts){if(end!==null){line+=(pt.x-end>6)?"   ":(pt.x-end>1?" ":"")}line+=pt.s;end=pt.x+pt.w}
      out.push(line)}
  }
  return out.join("\n");
}

/* ---------- data ---------- */
function derive(){
  const q=S.q.trim().toLowerCase();
  return S.items.filter(it=>{
    const r=S.rfqs[it.rfqId]||{};
    if(S.status&&it.status!==S.status)return false;
    if(S.hideDone&&!S.status&&DONE.has(it.status))return false;
    if(S.late&&!isLate(it))return false;
    if(S.rfqId&&it.rfqId!==S.rfqId)return false;
    if(S.cust&&r.customer!==S.cust)return false;
    if(S.sup&&srcLabel(it)!==S.sup)return false;
    if(q){const hay=[it.part,it.desc,it.unitAlat,r.customer,r.no,it.supplier,it.platform,it.orderNo,it.poNo,it.note].join(" ").toLowerCase();
      if(!hay.includes(q)&&!(normPn(q)&&normPn(it.part).includes(normPn(q))))return false}
    return true;
  }).sort((a,b)=>{const ra=S.rfqs[a.rfqId]||{},rb=S.rfqs[b.rfqId]||{};
    return (rb.date||"").localeCompare(ra.date||"")||(rb.createdAt||0)-(ra.createdAt||0)||(a.line||0)-(b.line||0)});
}
function history(part,exceptId){const n=normPn(part);if(!n)return[];return S.items.filter(i=>i.id!==exceptId&&normPn(i.part)===n)}

/* ---------- render ---------- */
function labelTables(root){(root||document).querySelectorAll("table.tt,table.mini").forEach(t=>{const th=[...(t.tHead?.rows[0]?.cells||[])].map(c=>c.textContent.trim());if(!th.length)return;
  for(const tr of t.tBodies[0]?.rows||[]){let i=0;for(const td of tr.cells){const span=td.colSpan||1;const l=th[i]||"";if(l&&!td.dataset.l&&i>0)td.dataset.l=l.replace(/\s+L laut.*$/i,"");i+=span}}})}
new MutationObserver(()=>labelTables($("#overlay"))).observe(document.getElementById("overlay")||document.body,{childList:true,subtree:true});
function renderView(){S.tab==="rfq"?renderRfqView():S.tab==="part"?renderPartView():S.tab==="quotes"?renderQuoteView():S.tab==="hist"?renderHistView():S.tab==="orders"?renderOrdersView():S.tab==="dash"?renderDash():renderItems();labelTables(document.querySelector(".wrap"))}
function render(){S.pnCount={};S.items.forEach(i=>{const n=normPn(i.part);if(n)S.pnCount[n]=(S.pnCount[n]||0)+1});

function askClean(t){return String(t||"").replace(/\b(pcs|pc|set|unit|ea|buah)\s*[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF]+/gi," ").replace(/[\u2E80-\u9FFF\uF900-\uFAFF\u3000-\u303F\uFF00-\uFFEF]+/g," ").replace(/\bCGSQ[-\s]?\d+\b/gi," ").replace(/\s*[-–,/]\s*$/,"").replace(/\s{2,}/g," ").trim()}

  const list=[...groups.values()];const askedOf=g=>[...new Set(g.ids.flatMap(id=>S.items.find(x=>x.id===id)?.askedTo||[]))];const pricedOf=g=>g.ids.some(id=>{const it=S.items.find(x=>x.id===id);return it&&(quotesOf(it).length||Number(it.price)>0)});

  const drawSups=()=>{$("#a_sups").innerHTML=allSups().map(x=>`<button type="button" class="chip ${supSel.has(x.name)?"on":""}" data-as="${esc(x.name)}"><span class="gp" style="--c:var(--ink)">${supSel.has(x.name)?"✓ ":""}${esc(x.name)}</span></button>`).join("")||`<span class="sub">Belum ada supplier tersimpan. Tambahkan di bawah.</span>`;
    $("#a_sups").querySelectorAll("[data-as]").forEach(b=>b.onclick=()=>{const n=b.dataset.as;supSel.has(n)?supSel.delete(n):supSel.add(n);drawSups();drawCards()})};
  const drawCards=()=>{const n=chosen().length;$("#a_sum").innerHTML=`${n} barang dipilih${supSel.size?` · ${supSel.size} supplier`:""}`;
    {const t=msgFor(null);$("#a_qprev").textContent=n?t:"Belum ada barang yang dicentang.";$("#a_qwa").href=`https://wa.me/?text=${encodeURIComponent(t)}`;$("#a_qwa").classList.toggle("dis",!n);["#a_qcopy","#a_qcopy2"].forEach(x=>$(x).disabled=!n)}
    $("#a_cards").innerHTML=supSel.size?[...supSel].map(name=>{const sp=(S.suppliers||{})[supKey(name)]||{};const st=sent[name];
      return `<div class="ask-c ${st?"sent":""}"><div class="ask-ch"><b>${esc(name)}</b>${st?`<span class="ok-tag">✓ terkirim ${st} barang</span>`:""}</div>
        <div class="ask-cr"><input data-aphone="${esc(name)}" inputmode="tel" placeholder="No. WA (opsional)" value="${esc(sp.phone||"")}">
        <button type="button" class="sm" data-acopy="${esc(name)}" ${n?"":"disabled"}>Salin pesan</button><a class="btn sm primary-btn ${n?"":"dis"}" data-awa="${esc(name)}" href="#" target="_blank" rel="noopener">Kirim WA (${n})</a></div></div>`}).join("")
      :`<p class="sub" style="margin:8px 0 0">Pilih satu atau beberapa supplier di atas. Setiap supplier mendapat pesan sendiri berisi barang yang dicentang.</p>`;
    $("#a_cards").querySelectorAll("[data-awa]").forEach(a=>{const name=a.dataset.awa;const ph=()=>$(`[data-aphone="${CSS.escape(name)}"]`).value;
      const upd=()=>{a.href=`https://wa.me/${waNum(ph())}?text=${encodeURIComponent(msgFor(name))}`};upd();$(`[data-aphone="${CSS.escape(name)}"]`).addEventListener("input",upd);

/* --- 2. read supplier reply (AI) inside paste-update modal --- */
async function aiReadReply(){
  const txt=$("#upText").value.trim();if(!txt){$("#upMsg").textContent="Tempel balasan supplier terlebih dahulu.";return}
  const sup=$("#u_supplier").value.trim();
  const pool=S.items.filter(i=>!DONE.has(i.status)&&i.part);const pref=sup?pool.filter(i=>(i.askedTo||[]).includes(sup)):[];
  const cand=[...new Map((pref.length?pref:pool).map(i=>[normPn(i.part),`${i.part} — ${i.desc}`])).values()].slice(0,400);
  $("#upMsg").textContent="Membaca balasan dengan AI…";$("#upAi").disabled=true;
  try{const r=await askJson(`Teks berikut adalah balasan WhatsApp/email dari supplier${sup?" ("+sup+")":""} atas permintaan harga spare parts dari PT Sentra Mulia Mandiri.\n\nDaftar part yang kami tanyakan (part number — nama):\n${cand.join("\n")}\n\nAmbil harga satuan untuk setiap part yang disebut di balasan. Cocokkan dengan part number di daftar (abaikan perbedaan spasi/tanda hubung; jika supplier hanya menyebut nama barang, cocokkan ke part yang paling jelas). Harga dalam rupiah angka penuh: "185rb" atau "185k" = 185000, "1,2jt" = 1200000, "185.000" = 185000. stock: "ready", "indent", "kosong", atau "". grade: jenis barang yang diberi harga, huruf besar: "OEM", "GENUINE", "ORIGINAL", "AFTERMARKET", "KW", atau label lain yang disebut supplier (mis. "TAIWAN"); kosongkan jika tidak disebut. Jika satu part diberi beberapa harga untuk jenis berbeda (mis. OEM 150rb, Genuine 210rb), buat entri terpisah per jenis. note: info singkat lain (merek, lead time), boleh kosong. Lewati part yang tidak diberi harga.\n\nBalas HANYA JSON: {"items":[{"partNumber":"","grade":"","price":0,"stock":"","note":""}]}\n\nBALASAN SUPPLIER:\n${txt.slice(0,30000)}`,{});
    const rows=(r?.items||[]).filter(x=>x&&x.partNumber);
    S.extraGrades=[...new Set([...(S.extraGrades||[]),...rows.map(x=>normGrade(x.grade)).filter(Boolean)])];
    $("#upText").value=rows.map(x=>[x.partNumber,Number(x.price)||"",normGrade(x.grade)].filter(v=>v!=="").join("\t")).join("\n");
    S.replyMeta=Object.fromEntries(rows.map(x=>[normPn(x.partNumber)+"|"+normGrade(x.grade),{stock:String(x.stock||""),note:String(x.note||"")}]));
    if(rows.some(x=>!normGrade(x.grade)))$("#upMsg").textContent+=" Sebagian harga tidak menyebut jenis: isi kolom Jenis barang sebagai default.";
    matchPaste();
  }catch(e){$("#upMsg").textContent=aiErr(e)}finally{$("#upAi").disabled=false}
}

/* --- 3. customer quotation (SMM Excel format) --- */
const QDEF={priceTerms:"Franco Jakarta",deliveryTime:"ASAP",validityQ:"1 WEEK",paymentTerms:"1 MONTH",vat:"Price Exclude PPN 11%",signer:"BENNY GUNAWAN",qCounter:1660,sig:true};
const qc=()=>{const o={...QDEF};for(const [k,v] of Object.entries(S.settings||{}))if(v!==""&&v!=null)o[k]=v;return o};
const rowDL=r=>(r.d!==undefined||r.l!==undefined)?{d:numOr(r.d),l:numOr(r.l)}:{d:"",l:numOr(r.price)};
const hasDL=rows=>(rows||[]).some(r=>r.d!==undefined||r.l!==undefined);
const rowPrimary=r=>{const x=rowDL(r);return x.l!==""?x.l:x.d};
/* quotation price mode: "l" laut saja, "u" udara saja, "lu" keduanya; old quotations keep their layout */
const qMode=d=>d&&["l","u","lu"].includes(d.mode)?d.mode:(hasDL(d&&d.rows)?"lu":"one");
const isDL=d=>qMode(d)==="lu";
const QMODE_LBL={l:"Laut",u:"Udara",lu:"Laut & Udara"};
const lastQMode=()=>{try{const m=localStorage.getItem("smm_qmode");if(["l","u","lu"].includes(m))return m}catch{}return "l"};
const modeRows=(rows,m)=>m==="l"?rows.map(r=>({...r,d:"",price:r.l,total:(Number(r.l)||0)*(Number(r.qty)||0)})):m==="u"?rows.map(r=>({...r,l:"",price:r.d,total:(Number(r.d)||0)*(Number(r.qty)||0)})):rows;
const rowGrade=r=>r.g!=null&&r.g!==""?normGrade(r.g):normGrade(r.brand);
function quoteRowsFor(i){const base={id:i.id,inc:true,group:i.unitAlat||"",desc:[i.desc,i.part].filter(Boolean).join(" "),qty:Number(i.qty)||0,unit:i.unit||"PCS"};
  const o=i.sellOpts||[];if(o.length)return o.map(x=>({...base,g:x.g,d:x.d,l:x.l,brand:x.g||i.brand||"",cost:costFor(i,x.g)}));
  const gs=[...new Set(quotesOf(i).map(q=>q.grade).filter(Boolean))];if(gs.length)return gs.map(g=>({...base,g,d:"",l:"",brand:g,cost:costFor(i,g)}));
  return [{...base,g:normGrade(i.brand),d:"",l:"",brand:i.brand||"",cost:Number(i.price)>0?Number(i.price):""}]}
async function saveOptsFromRows(rows){const by={};rows.forEach(r=>{if(r.d===""&&r.l==="")return;(by[r.id]=by[r.id]||[]).push({g:rowGrade(r),d:r.d,l:r.l})});
  const want={};for(const [id,nw] of Object.entries(by)){const it=S.items.find(x=>x.id===id);if(!it)continue;const m=mergeOpts(it.sellOpts||[],nw);if(JSON.stringify(m)!==JSON.stringify(it.sellOpts||[]))want[id]=m}
  const ids=Object.keys(want);if(!ids.length)return true;return setSellOpts(ids,id=>want[id])}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],ROM=["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];
const fmtEn=n=>(n===""||n==null||isNaN(n))?"":Number(n).toLocaleString("en-US");
const dShort=s=>fmtD(s);
const custKey=n=>supKey(n);
function nextQNo(){const c=qc();const d=new Date();return `${(Number(c.qCounter)||0)+1}/SMM-QUOT/${ROM[d.getMonth()]}/${d.getFullYear()}`}
let Q=null;

  const eq=qid?(S.quotes||{})[qid]:null;if(eq)ids=(qData(eq).rows||[]).map(r=>r.id);

  Q={rfqIds,rows:its.flatMap(quoteRowsFor),mode:lastQMode()};

async function readDocText(f,onMsg){
  if(f.type.startsWith("image/")){onMsg("Membaca foto (OCR)…");const src=await fileCanvases(f);const o=await ocrCanvas(await src.get(1));return o.text}
  if(!window.pdfjsLib)throw {message:"Pembaca PDF gagal dimuat. Muat ulang halaman."};
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let out=[];
  for(let n=1;n<=pdf.numPages;n++){onMsg(`Membaca halaman ${n} dari ${pdf.numPages}…`);let t=await pdfPageText(pdf,n);
    if(t.replace(/\s/g,"").length<60){const page=await pdf.getPage(n);const v0=page.getViewport({scale:1});const vp=page.getViewport({scale:Math.min(3,2200/Math.max(v0.width,v0.height))});
      const c=document.createElement("canvas");c.width=Math.round(vp.width);c.height=Math.round(vp.height);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);await page.render({canvasContext:x,viewport:vp}).promise;
      onMsg(`Halaman ${n}: hasil scan, membaca dengan OCR…`);t=(await ocrCanvas(c)).text}
    out.push(t)}
  return out.join("\n\n--- halaman berikut ---\n\n")}
const CPO_PROMPT=`Teks berikut adalah Purchase Order (PO) dari customer kepada PT Sentra Mulia Mandiri (supplier spare parts alat berat & truk). Teks bisa berasal dari OCR sehingga ada salah baca karakter (O/0, I/1, S/5) dan kolom tercampur.
Ambil: nomor PO, tanggal PO (format YYYY-MM-DD), nama perusahaan pembeli, dan setiap baris barang yang dipesan: part number (jika ada), nama/deskripsi barang, qty (angka), satuan, harga satuan (rupiah angka penuh, tanpa titik; "Rp 1.250.000" = 1250000), dan catatan pengiriman/moda (mis. "via laut", "udara") bila tertulis per baris atau untuk seluruh PO.
Abaikan baris subtotal, PPN, ongkir, dan total. Balas JSON: {"poNo":"","poDate":"","customer":"","shipMode":"","lines":[{"partNumber":"","description":"","qty":0,"unit":"","unitPrice":0,"note":""}]}`;
function matchLine(line,cands){const k=looseKey(line.partNumber||"");
  let hit=k?cands.find(i=>i.part&&looseKey(i.part)===k):null;
  if(!hit&&k&&k.length>=5)hit=cands.find(i=>i.part&&(looseKey(i.part).includes(k)||k.includes(looseKey(i.part))));
  if(!hit){const toks=String(line.description||"").toUpperCase().split(/[^A-Z0-9]+/).filter(t=>t.length>2);let best=null,bs=0;
    for(const i of cands){const d=String(i.desc||"").toUpperCase();const sc=toks.filter(t=>d.includes(t)).length/Math.max(1,toks.length);if(sc>bs){bs=sc;best=i}}if(bs>=.6)hit=best}
  return hit||null}
function matchOpt(it,price,shipMode){const os=(it?.sellOpts||[]);const cand=[];os.forEach(o=>{if(o.l!=="")cand.push({g:o.g,m:"laut",v:Number(o.l)});if(o.d!=="")cand.push({g:o.g,m:"udara",v:Number(o.d)})});
  if(!cand.length)return {g:it?.orderedGrade||"",m:/udara|air/i.test(shipMode||"")?"udara":/laut|sea/i.test(shipMode||"")?"laut":""};
  let c=cand;if(/udara|air/i.test(shipMode||""))c=cand.filter(x=>x.m==="udara").length?cand.filter(x=>x.m==="udara"):cand;else if(/laut|sea/i.test(shipMode||""))c=cand.filter(x=>x.m==="laut").length?cand.filter(x=>x.m==="laut"):cand;
  if(Number(price)>0){const b=c.reduce((a,x)=>Math.abs(x.v-price)<Math.abs(a.v-price)?x:a);return {g:b.g,m:b.m,diff:Math.abs(b.v-price)/price}}

async function ensureCpoItems(cpoId){const p=(S.cpos||{})[cpoId];if(!p)return [];const lines=(p.lines||[]).map(l=>({...l}));

function renderGudang(){const b=$("#ordBody");const q=S.q.trim().toLowerCase();const t=today();const lim=new Date(Date.now()-14*864e5).toISOString().slice(0,10);

  open=open.filter(match);const cnt={all:open.length,today:open.filter(i=>etaOf(i)===t).length,late:open.filter(i=>etaOf(i)&&etaOf(i)<t).length,part:open.filter(i=>Number(i.recvQty)>0).length};

      <div class="gl-main"><div class="gl-n">${esc(i.desc||"")}</div><div class="gl-p"><span class="pn">${esc(i.part||"—")}</span>${i.orderedGrade?` · ${esc(i.orderedGrade)}`:""}</div></div>

      <div class="gl-act">${canW()&&!isDone?`<button type="button" class="sm ghost" data-recv="${i.id}" title="Barang datang sebagian">Sebagian…</button>`:""}</div></li>`};

async function quickRecv(id,el){const i=S.items.find(x=>x.id===id);if(!i)return;const oq=Number(i.ordQty)||ordQty(i);const prev={status:i.status,recvQty:i.recvQty||0,arrived:i.arrived||"",receipts:i.receipts||[]};

const DAY=864e5;const ymd=d=>new Date(d).toISOString().slice(0,10);const daysSince=s=>s?Math.floor((Date.now()-new Date(typeof s==="number"?s:s+"T00:00:00").getTime())/DAY):0;
const fuDays=()=>Number((S.settings||{}).followDays)||7;
function dashData(){const t=today();const qs=Object.values(S.quotes||{}).filter(q=>q.d);
  const pend=qs.filter(q=>qStatus(q)==="pending").sort((a,b)=>(a.submittedAt||0)-(b.submittedAt||0));
  const appr=qs.filter(q=>qStatus(q)==="approved");
  const waiting=appr.map(q=>{const a=S.approvals[q.id];const ids=[...new Set(qRows(q).map(r=>r.id))];const its=ids.map(id=>S.items.find(i=>i.id===id)).filter(Boolean);
      const open=its.filter(i=>["baru","cari","tawar"].includes(i.status));return {q,a,its,open,age:daysSince(a?.at||q.submittedAt)}})
    .filter(x=>x.open.length&&x.age>=fuDays()).sort((a,b)=>b.age-a.age);
  const soLate=Object.values(S.sos||{}).map(o=>{const its=(o.lines||[]).map(l=>S.items.find(i=>i.id===l.itemId)).filter(Boolean);const open=its.filter(i=>OPEN_IN.has(i.status));return {o,open,late:o.eta?daysSince(o.eta):0}})
    .filter(x=>x.o.eta&&x.o.eta<t&&x.open.length).sort((a,b)=>b.late-a.late);
  const notOrdered=S.items.filter(i=>i.status==="po"&&!i.soId);
  const lateItems=S.items.filter(i=>OPEN_IN.has(i.status)&&((S.sos||{})[i.soId]?.eta||i.eta)&&((S.sos||{})[i.soId]?.eta||i.eta)<t);
  const mStart=t.slice(0,8)+"01";const pm=new Date(mStart);pm.setMonth(pm.getMonth()-1);const pmStart=ymd(pm);
  const cpos=Object.values(S.cpos||{});const poM=cpos.filter(p=>(p.date||"")>=mStart),poPM=cpos.filter(p=>(p.date||"")>=pmStart&&(p.date||"")<mStart);
  const sum=a=>a.reduce((s,p)=>s+(Number(p.total)||0),0);
  const since=ymd(Date.now()-90*DAY);const dec=S.items.filter(i=>(WONSET.has(i.status)&&(i.poDate||"")>=since)||(i.status==="kalah"&&(i.lostAt||i.updatedAt&&ymd(i.updatedAt)||"")>=since));
  const won=dec.filter(i=>WONSET.has(i.status)).length,lost=dec.filter(i=>i.status==="kalah").length;
  const months=[];for(let k=5;k>=0;k--){const d=new Date(mStart);d.setMonth(d.getMonth()-k);const a=ymd(d),e=new Date(d);e.setMonth(e.getMonth()+1);const b=ymd(e);months.push({l:["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"][d.getMonth()],v:sum(cpos.filter(p=>(p.date||"")>=a&&(p.date||"")<b))})}
  const reasons={};S.items.filter(i=>i.status==="kalah"&&(i.lostAt||"")>=since).forEach(i=>{const r=i.lostReason||"Tanpa alasan";reasons[r]=(reasons[r]||0)+1});
  return {pend,waiting,soLate,notOrdered,lateItems,poM,poPM,sum,won,lost,months,reasons}}
function remindCount(){if(!S.db)return 0;const d=dashData();return d.pend.length*(S.isApprover?1:0)+d.waiting.length+d.soLate.length}

  S.isGudang=!!S.myId&&(S.roles?.gudang||[]).includes(S.myId)&&!S.isApprover&&!S.isOwner;

  const rb=$("#btnRoles");if(rb)rb.hidden=!S.isOwner}
function applySell(){const t=trustedIds();const m={};for(const aid of t){const map=S.sellBy[aid]||{};for(const [iid,v] of Object.entries(map)){if(!m[iid]||(v.at||0)>(m[iid].at||0))m[iid]=v}}
  S.sell=m;for(const it of S.items){const v=m[it.id];it.sellOpts=optsOf(v,it);const pv=v&&Array.isArray(v.opts)?primaryOf(it.sellOpts):(v?v.price:"");it.sellPrice=pv!==""&&pv!=null?Number(pv):""}}

const SUBS={};

  for(const k of Object.keys(SUBS)){if(!t.includes(k)){SUBS[k].forEach(u=>u());delete SUBS[k];delete S.sellBy[k];delete S.apprBy[k]}}
  for(const aid of t){if(SUBS[aid])continue;
    SUBS[aid]=[S.db.collection(`sell/${aid}/i`).onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.sellBy[aid]=m;applySell();safeRender();maybeMigrate()},()=>{}),
      S.db.collection(`appr/${aid}/q`).onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.apprBy[aid]=m;applyAppr();safeRender()},()=>{})]}
  applySell();applyAppr()}

function qStatus(q){if(!q.d)return "legacy";const a=(S.approvals||{})[q.id];if(a&&a.submittedAt===q.submittedAt)return a.status;return q.status==="draft"?"draft":"pending"}
const QST={draft:{l:"Draft",c:"--s-baru"},pending:{l:"Menunggu persetujuan",c:"--s-po"},approved:{l:"Disetujui",c:"--s-tiba"},revision:{l:"Perlu revisi",c:"--s-batal"},legacy:{l:"Uji coba (versi lama)",c:"--s-baru"}};
function qRows(q){if(!q.d)return q.rows||[];const a=(S.approvals||{})[q.id];return (a&&a.submittedAt===q.submittedAt&&a.snapshot?a.snapshot.rows:q.d?.rows)||[]}
function qCost(q){const CM=quoteCostFn(q.d).fn;return qRows(q).reduce((s,r)=>{const it=S.items.find(x=>x.id===r.id);const x=rowDL(r);const c=it?Number(CM(it,rowGrade(r),x.l!==""||x.d===""?"l":"d")):0;return s+(c>0&&rowPrimary(r)!==""?c*(Number(r.qty)||0):0)},0)}
function qTotal(q){return qRows(q).reduce((s,r)=>s+(Number(rowPrimary(r))||0)*(Number(r.qty)||0),0)}
function pendingCount(){return Object.values(S.quotes||{}).filter(q=>qStatus(q)==="pending").length}
const nameOf=id=>id&&S.names[id]?S.names[id]:(id&&id===S.myId?(S.me?.name||"Anda"):"—");

async function submitQuote(asApprover){
  const d=quoteData();if(!d.rows.length){toast("Tidak ada item yang disertakan");return false}
  {const dup=Object.values(S.quotes||{}).find(q=>q.id!==Q.editId&&normNo(q.no)===normNo(d.no));if(dup){toast(`Nomor ${d.no} sudah dipakai quotation lain. Ganti nomornya (mis. ${nextQNo()}).`);$("#q_no")?.focus();return false}}

  if(Object.values(ids0).some(bs=>bs.length>1&&(bs.some(b=>!b)||new Set(bs).size<bs.length))){toast("Part yang punya beberapa baris wajib diberi Brand/jenis berbeda (mis. OEM dan GENUINE)");return false}
  const miss=d.rows.filter(r=>r.d===""&&r.l==="").length;
  if(miss&&S.isApprover&&!S.quoteMissOk){S.quoteMissOk=true;toast(`${miss} item belum ada harga. Klik sekali lagi untuk tetap menyetujui.`);return false}
  S.quoteMissOk=false;
  const now=Date.now();const id=Q.editId||S.db.collection("quotes").doc().id;const old=(S.quotes||{})[id];
  const rec={no:d.no,d:{...d,rows:d.rows.map(r=>({id:r.id,group:r.group,desc:r.desc,qty:r.qty,unit:r.unit,g:r.g,d:r.d,l:r.l,price:r.price,brand:r.brand}))},rfqIds:Q.rfqIds,
    status:"pending",submittedAt:now,createdAt:old?.createdAt||now,createdBy:old?.createdBy||S.myId||"",updatedAt:now,updatedBy:S.myId||""};
  try{await S.db.doc("quotes/"+id).set(rec);
    const c=qc();const seq=Number((d.no.match(/^\s*(\d+)/)||[])[1]);if(seq&&seq>(Number(c.qCounter)||0))await S.db.doc("settings/company").set({...(S.settings||{}),qCounter:seq});
    if(Q.rfqIds.length===1&&S.rfqs[Q.rfqIds[0]]){const r=S.rfqs[Q.rfqIds[0]];if(String(r.ongkirL??"")!==String(d.fl)||String(r.ongkirU??"")!==String(d.fu))await S.db.doc("rfqs/"+Q.rfqIds[0]).update({ongkirL:d.fl,ongkirU:d.fu,updatedAt:now})}

    if(asApprover){await approveQuote({id,...rec},"");return {id,rec}}
    return {id,rec}}catch(e){fail(e);return false}
}
async function approveQuote(q,note,prices){
  if(!S.isApprover){toast("Hanya penyetuju yang dapat menyetujui quotation.");return false}
  const rows=(q.d?.rows||[]).map((r,k)=>{const x=prices&&prices[k]?prices[k]:rowDL(r);return {...r,g:rowGrade(r),d:x.d,l:x.l,price:x.l!==""?x.l:x.d}});
  await saveOptsFromRows(rows);
  try{await S.db.doc(`appr/${S.myId}/q/${q.id}`).set({status:"approved",note:note||"",by:S.myId||"",at:Date.now(),submittedAt:q.submittedAt,snapshot:{...q.d,rows}});
    for(let i=0;i<rows.length;i+=8)await Promise.all(rows.slice(i,i+8).map(r=>{const it=S.items.find(x=>x.id===r.id);if(!it)return null;const p={};if(["baru","cari"].includes(it.status))p.status="tawar";return Object.keys(p).length?S.db.doc("items/"+r.id).update(stamp(p)):null}));
    return true}catch(e){if(e?.code==="invalid_argument")toast("Persetujuan tidak tersimpan: akun ini belum ditunjuk sebagai penyetuju oleh pemilik.");else fail(e);return false}
}

function parsePrice(t){t=String(t).replace(/rp\.?/i,"").trim();if(!/^\d[\d.,]*$/.test(t))return null;
  if(/,\d{1,2}$/.test(t))t=t.replace(/\./g,"").replace(",",".");else t=t.replace(/[.,](?=\d{3}(\D|$))/g,"");const n=Number(t);return isNaN(n)?null:n}
function matchPaste(){
  const lines=$("#upText").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);const scope=$("#u_scope").value;
  const pool=S.items.filter(i=>scope==="sel"?S.sel.has(i.id):!DONE.has(i.status));
  const idx=new Map();pool.forEach(i=>{const n=normPn(i.part);if(!n)return;if(!idx.has(n))idx.set(n,[]);idx.get(n).push(i)});
  upd=[];const miss=[];const KG=knownGrades();
  for(const line of lines){
    let cells=line.includes("\t")?line.split("\t"):line.split(/ {2,}|\s*[;|]\s*/);cells=cells.map(c=>c.trim()).filter(Boolean);
    if(cells.length===1){const toks=line.split(/\s+/);let best=null;
      for(let a=0;a<toks.length&&!best;a++)for(let b=toks.length;b>a;b--){const n=normPn(toks.slice(a,b).join(" "));if(idx.has(n)){best={n,rest:toks.slice(0,a).concat(toks.slice(b))};break}}
      if(best){cells=[best.n,...best.rest]}}
    let n=normPn(cells[0]);let hits=idx.get(n);
    if(!hits){for(let k=1;k<cells.length&&!hits;k++){const m=normPn(cells[k]);if(idx.has(m)){hits=idx.get(m);cells=[cells[k],...cells.filter((_,j)=>j!==k)];n=m}}}
    if(!hits){miss.push(line);continue}
    let price=null,sell=null,order="",grade="";for(const c of cells.slice(1)){const p=parsePrice(c);if(p!=null&&p>=100&&price==null)price=p;else if(p!=null&&p>=100&&sell==null)sell=p;else if(!grade&&KG.has(normGrade(c)))grade=normGrade(c);else if(!order)order=c}
    upd.push({line,part:hits[0].part,ids:hits.map(h=>h.id),price,sell,order,grade});
  }
  const nItems=upd.reduce((s,u)=>s+u.ids.length,0);
  $("#upMsg").textContent=lines.length?`${upd.length} dari ${lines.length} baris cocok → ${nItems} item akan di-update${miss.length?`, ${miss.length} baris tidak ditemukan`:""}.`:"Tempel daftar terlebih dahulu.";
  $("#upPrev").innerHTML=(upd.length?`<div class="tbl-wrap"><table class="mini"><thead><tr><th>Part Number</th><th class="num">Item</th><th>Jenis</th><th class="num">Harga Supplier</th><th class="num">Harga Tawar (laut)</th><th>No. Order</th></tr></thead><tbody>${upd.map(u=>{const dg=normGrade($("#u_grade")?.value);return `<tr><td class="pn">${esc(u.part)}</td><td class="num">${u.ids.length}</td><td>${u.grade?`<b>${esc(u.grade)}</b>`:dg?`<span class="sub">${esc(dg)}</span>`:(u.price!=null||u.sell!=null)?`<span class="late-tag">isi jenis</span>`:""}</td><td class="num">${u.price!=null?rp(u.price):""}</td><td class="num">${u.sell!=null?rp(u.sell):""}</td><td class="pn">${esc(u.order)}</td></tr>`}).join("")}</tbody></table></div>`:"")
    +(miss.length?`<div class="dupnote" style="margin-top:8px">Tidak ditemukan: ${miss.slice(0,10).map(esc).join(" · ")}${miss.length>10?` (+${miss.length-10} lagi)`:""}</div>`:"");
  $("#upApply").disabled=!upd.length;$("#upApply").textContent=upd.length?`Terapkan ke ${nItems} item`:"Terapkan";
}

}

/* ---------- AI reading ---------- */
const AI_RULES=`Balas HANYA dengan JSON berbentuk:
{"docs":[{"rfqNo":"","date":"YYYY-MM-DD","customer":"","continued":false,"items":[{"rfqNo":"","partNumber":"","name":"","unit":"","qty":1,"uom":"PCS"}]}]}

Aturan:
- Satu dokumen permintaan = satu entri di "docs". rfqNo = nomor dokumen (No., No. PR, No. RFQ, No. Ref), salin persis tanpa tanda centang.
- date = tanggal dokumen (bukan tanggal cetak, bukan tanggal diperlukan) dalam format YYYY-MM-DD, kosongkan bila tidak ada.
- customer = nama perusahaan pengirim dari kop surat atau logo; kosongkan bila tidak jelas.
- continued = true hanya bila halaman ini lanjutan tabel dari halaman sebelumnya tanpa nomor dokumen sendiri.
- partNumber = nomor part pabrikan, biasanya setelah "P/N", "Part No", "PN", atau di kolom part number. Rapikan spasi di sekitar tanda hubung ("23390 - 78450" menjadi "23390-78450"). Bila tidak ada P/N tertulis tetapi nama barang memuat nomor tipe yang jelas (misalnya "BEARING 32207" menjadi "32207"), pakai nomor itu. JANGAN gunakan kode barang / kode stok / item code internal pelanggan (kolom "Kode Barang" berupa angka seperti 320060058) sebagai partNumber. Kosongkan bila tidak ada.
- name = nama barang tanpa bagian P/N-nya.
- unit = alat atau kendaraan pemakai part (merek, model, nomor polisi, kode unit, tahun), biasanya di kolom keterangan / unit / remark / untuk. Salin ringkas. Kosongkan bila tidak disebut.
- qty = jumlah diminta (angka), uom = satuan (PCS, SET, BH, dll.).

async function runBatch(ids,patch){for(let i=0;i<ids.length;i+=8)await Promise.all(ids.slice(i,i+8).map(id=>{const it=S.items.find(x=>x.id===id);const p={...patch};
  if(p.status==="beli"&&!it?.bought&&!p.bought)p.bought=today();if(p.status==="tiba"&&!it?.arrived)p.arrived=today();
  return S.db.doc("items/"+id).update(stamp(p))}))}

  <button type="button" data-mt="items"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12 M8 12h12 M8 18h12 M4 6h.01 M4 12h.01 M4 18h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Semua Item</button>
  <button type="button" data-mt="hist"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7 M3 4v5h5 M12 7v5l3 3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>Riwayat Harga</button></div>
 <h4>Alat</h4><div class="mg">
  <button type="button" data-ma="btnExport"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11 M7 10l5 5 5-5 M5 20h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>Ekspor CSV</button>
  <button type="button" data-ma="btnPasteUpd"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z M13 7l4 4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>Update massal</button>
  <button type="button" data-ma="btnRoles" id="msRoles"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M2 21c0-4 3-6 7-6s7 2 7 6 M17 4a4 4 0 0 1 0 7 M22 21c0-3-2-5-4-5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Peran</button></div>
</div></div>
<script>
(function(){
 const tabBtn={dash:"tabDash",rfq:"tabRfq",quotes:"tabQuotes",orders:"tabOrders",part:"tabPart",items:"tabItems",hist:"tabHist"};
 const sheet=document.getElementById("moreSheet");
 const go=t=>{document.getElementById(tabBtn[t])?.click();window.scrollTo({top:0})};
 document.getElementById("bnav").addEventListener("click",e=>{const b=e.target.closest("[data-bt]");if(!b)return;const t=b.dataset.bt;if(t==="more"){syncNav();sheet.classList.add("open");return}go(t)});
 sheet.addEventListener("click",e=>{if(e.target.closest("[data-msclose]")){sheet.classList.remove("open");return}
   const m=e.target.closest("[data-mt]");if(m){sheet.classList.remove("open");go(m.dataset.mt);return}
   const a=e.target.closest("[data-ma]");if(a){sheet.classList.remove("open");document.getElementById(a.dataset.ma)?.click()}});
 document.getElementById("fab").onclick=()=>document.getElementById("btnNew").click();
 function syncNav(){const t=S.tab,more=["part","items","hist"].includes(t);
   document.querySelectorAll("#bnav [data-bt]").forEach(b=>b.classList.toggle("on",b.dataset.bt===t||(b.dataset.bt==="more"&&more)));
   document.querySelectorAll("#moreSheet [data-mt]").forEach(b=>b.classList.toggle("on",b.dataset.mt===t));
   const w=document.getElementById("who");document.getElementById("msWho").textContent=w&&w.textContent?"Masuk sebagai "+w.textContent:"";const rb=document.getElementById("btnRoles");document.getElementById("msRoles").hidden=!rb||rb.hidden;
   const cp=(src,dst)=>{const s=document.getElementById(src),d=document.querySelector(`#bnav [data-bt="${dst}"] .bb`);if(d){d.hidden=!s||s.hidden;d.textContent=s?s.textContent:""}};
   cp("dBadge","dash");cp("qBadge","quotes");cp("oBadge","orders");
   document.getElementById("fab").hidden=!["rfq","items","part"].includes(t)||S.canWrite===false}
 window.syncNav=syncNav;
 const _r=render;render=function(){const r=_r.apply(this,arguments);try{syncNav()}catch{}return r};
 const ov=document.getElementById("overlay");
 new MutationObserver(()=>{const open=!!ov.firstElementChild;document.body.classList.toggle("ovl",open);document.documentElement.style.overflow=open&&innerWidth<=640?"hidden":""}).observe(ov,{childList:true});
 const kb=root=>root.querySelectorAll&&root.querySelectorAll("input").forEach(i=>{if(i.dataset.kb)return;i.dataset.kb=1;
   if(i.type==="number"||i.classList.contains("pin")||i.closest(".rpw")){if(!i.inputMode)i.inputMode="decimal";i.enterKeyHint="done"}
   else if(i.type==="search")i.enterKeyHint="search"});
 new MutationObserver(ms=>{for(const m of ms)m.addedNodes.forEach(n=>n.nodeType===1&&kb(n))}).observe(document.body,{childList:true,subtree:true});
 kb(document);syncNav();
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>

</body></html>
